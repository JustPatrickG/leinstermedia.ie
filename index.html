<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Leinster Media</title>
  <meta name="description" content="Short-form video and paid lead generation for estate agents across Leinster." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22black%22/><text x=%2250%22 y=%2265%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22monospace%22>lm</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="video-bg" id="videoBg">
    <video id="bgVideo" autoplay muted loop playsinline></video>
    <div class="video-overlay"></div>
  </div>

  <main class="screen" id="screen">
    <h1 class="title" id="title">Leinster Media</h1>
    <nav class="menu" id="menu" aria-label="Site navigation">
      <a class="menu-item" href="packages.html">packages</a>
      <a class="menu-item" href="results.html">results</a>
      <a class="menu-item" href="contact.html">contact</a>
    </nav>
  </main>

  <script src="brand.js"></script>
  <script>
    const screenEl = document.getElementById('screen');
    const title = document.getElementById('title');
    const menu = document.getElementById('menu');
    const menuItems = document.querySelectorAll('#menu .menu-item');
    const videoBg = document.getElementById('videoBg');
    const bgVideo = document.getElementById('bgVideo');

    // Portrait on mobile, landscape on desktop — fallback to reel.mp4 if specific file missing
    const isMobile = window.innerWidth < 640;
    const preferred = isMobile ? 'reel.mp4' : 'reel2.mp4';

    function loadVideo(src, fallback) {
      bgVideo.src = src;
      bgVideo.onerror = () => { if (fallback) { bgVideo.src = fallback; bgVideo.load(); bgVideo.play().catch(() => {}); } };
      bgVideo.load();
    }

    loadVideo(preferred, 'reel.mp4');

    screenEl.classList.add('show');

    growBrandTitle(title, () => {
      setTimeout(() => {
        title.classList.add('rise');
        setTimeout(() => {
          bgVideo.play().catch(() => {});
          videoBg.classList.add('show');
          menu.style.opacity = '1';
          menuItems.forEach((item, i) => {
            setTimeout(() => item.classList.add('show'), i * 130);
          });
          armSecretTap();
        }, 400);
      }, 300);
    });

    function armSecretTap() {
      let lastTap = 0;
      title.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastTap < 400) window.location.href = 'dashboard.html';
        lastTap = now;
      });
    }
  </script>
</body>
</html>
