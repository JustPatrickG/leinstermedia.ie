<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Portfolio — Leinster Media</title>
  <meta name="description" content="A look at recent listing videos from Leinster Media." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22black%22/><text x=%2250%22 y=%2265%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22monospace%22>lm</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .pf-wrap { max-width: 760px; width: 100%; margin: 0 auto; padding: 7rem 2rem 5rem; display: flex; flex-direction: column; gap: 2.2rem; }

    /* Desktop: both videos side by side, no nav needed */
    .pf-carousel { position: relative; width: 100%; display: flex; justify-content: center; gap: 1.4rem; }
    .pf-track { position: relative; width: min(46%, 320px); aspect-ratio: 9 / 16; max-height: 70vh; background: #050505; border: 1px solid var(--fg-faint); border-radius: 4px; overflow: hidden; }
    .pf-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }

    .pf-nav { display: none; position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.55); border: 1px solid var(--fg-faint2); color: var(--fg); width: 40px; height: 40px; border-radius: 50%; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; transition: background 200ms ease, border-color 200ms ease; z-index: 5; }
    .pf-nav:hover { background: rgba(0,0,0,0.8); border-color: var(--fg); }
    .pf-prev { left: -4px; }
    .pf-next { right: -4px; }
    .pf-dots { display: none; justify-content: center; gap: 8px; margin-top: 1.2rem; }
    .pf-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-faint2); border: none; cursor: pointer; padding: 0; transition: background 200ms ease, transform 200ms ease; }
    .pf-dot.active { background: var(--ac); transform: scale(1.3); }
    .pf-counter { display: none; text-align: center; font-size: 0.78rem; color: var(--fg-dim); letter-spacing: 0.05em; margin-top: 0.6rem; }

    /* Mobile: one video at a time, with nav */
    @media (max-width: 720px) {
      .pf-track { width: min(100%, 340px); }
      .pf-track.pf-hide-mobile { display: none; }
      .pf-nav { display: flex; }
      .pf-dots { display: flex; }
      .pf-counter { display: block; }
    }
  </style>
</head>
<body>

  <div class="loader" id="loader">
    <h1 class="title" id="loaderTitle">Leinster Media</h1>
  </div>

  <a class="back-link" href="index.html">&larr; back</a>

  <main class="screen" id="screen">
    <div class="pf-wrap">

      <div class="section">
        <span class="eyebrow">Portfolio</span>
        <h1 class="section-heading">Recent listing videos</h1>
        <p class="body-text">A sample of the short-form content we've produced for listings — shot, edited, and ready to post or run as ads.</p>
      </div>

      <div class="pf-carousel">
        <div class="pf-track" id="pfTrack0">
          <video class="pf-video" id="pfVid0" src="reel1.mp4" muted loop playsinline preload="metadata" autoplay></video>
        </div>
        <div class="pf-track pf-hide-mobile" id="pfTrack1">
          <video class="pf-video" id="pfVid1" src="reel2.mov" muted loop playsinline preload="metadata"></video>
        </div>
        <button class="pf-nav pf-prev" onclick="pfMove(-1)" aria-label="Previous video">&larr;</button>
        <button class="pf-nav pf-next" onclick="pfMove(1)" aria-label="Next video">&rarr;</button>
      </div>

      <div class="pf-dots" id="pfDots"></div>
      <div class="pf-counter" id="pfCounter"></div>

      <hr class="rule" />

      <div class="cta-block">
        <p class="body-text">Want content like this for your own listings? First shoot is free.</p>
        <a class="cta-link" href="contact.html">Get in touch &rarr;</a>
      </div>

    </div>
  </main>

  <script src="brand.js"></script>
  <script>
    const loader = document.getElementById('loader');
    const loaderTitle = document.getElementById('loaderTitle');
    const screenEl = document.getElementById('screen');
    growBrandTitle(loaderTitle, () => {
      setTimeout(() => {
        loader.classList.add('fade-out');
        screenEl.classList.add('show');
        setTimeout(() => loader.remove(), 480);
      }, 500);
    });

    // ── Portfolio: side-by-side on desktop, one-at-a-time carousel on mobile ──
    const tracks = [document.getElementById('pfTrack0'), document.getElementById('pfTrack1')];
    const vids = [document.getElementById('pfVid0'), document.getElementById('pfVid1')];
    const dotsWrap = document.getElementById('pfDots');
    const counter = document.getElementById('pfCounter');
    let pfIndex = 0;

    vids.forEach((v, i) => {
      const dot = document.createElement('button');
      dot.className = 'pf-dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Go to video ' + (i + 1));
      dot.addEventListener('click', () => pfGoTo(i));
      dotsWrap.appendChild(dot);
      v.play().catch(() => {});
    });

    function isMobile() { return window.innerWidth <= 720; }

    function updateCounter() {
      counter.textContent = (pfIndex + 1) + ' / ' + vids.length;
    }

    function pfGoTo(i) {
      pfIndex = (i + vids.length) % vids.length;
      if (isMobile()) {
        tracks[0].classList.toggle('pf-hide-mobile', pfIndex !== 0);
        tracks[1].classList.toggle('pf-hide-mobile', pfIndex !== 1);
      }
      Array.from(dotsWrap.children).forEach((d, idx) => d.classList.toggle('active', idx === pfIndex));
      updateCounter();
    }

    function pfMove(dir) { pfGoTo(pfIndex + dir); }

    updateCounter();

    // Swipe support on mobile
    let touchStartX = 0;
    document.querySelector('.pf-carousel').addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    document.querySelector('.pf-carousel').addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) pfMove(dx < 0 ? 1 : -1);
    }, { passive: true });

    // Handle resize: reset to showing both on desktop
    window.addEventListener('resize', () => {
      if (!isMobile()) {
        tracks[0].classList.remove('pf-hide-mobile');
        tracks[1].classList.remove('pf-hide-mobile');
      } else {
        pfGoTo(pfIndex);
      }
    });
  </script>
</body>
</html>
