<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Portfolio — Leinster Media</title>
  <meta name="description" content="A look at recent listing videos from Leinster Media." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22black%22/><text x=%2250%22 y=%2265%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22monospace%22>lm</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .pf-wrap { max-width: 720px; width: 100%; margin: 0 auto; padding: 7rem 2rem 5rem; display: flex; flex-direction: column; gap: 2.2rem; }
    .pf-carousel { position: relative; width: 100%; }
    .pf-track { position: relative; width: 100%; aspect-ratio: 9 / 16; max-height: 78vh; margin: 0 auto; background: #050505; border: 1px solid var(--fg-faint); border-radius: 4px; overflow: hidden; }
    .pf-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 400ms ease; pointer-events: none; }
    .pf-video.active { opacity: 1; pointer-events: auto; }
    .pf-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.55); border: 1px solid var(--fg-faint2); color: var(--fg); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; transition: background 200ms ease, border-color 200ms ease; z-index: 5; }
    .pf-nav:hover { background: rgba(0,0,0,0.8); border-color: var(--fg); }
    .pf-prev { left: 12px; }
    .pf-next { right: 12px; }
    .pf-dots { display: flex; justify-content: center; gap: 8px; margin-top: 1.2rem; }
    .pf-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-faint2); border: none; cursor: pointer; padding: 0; transition: background 200ms ease, transform 200ms ease; }
    .pf-dot.active { background: var(--ac); transform: scale(1.3); }
    .pf-counter { text-align: center; font-size: 0.78rem; color: var(--fg-dim); letter-spacing: 0.05em; margin-top: 0.6rem; }
  </style>
</head>
<body>

  <div class="loader" id="loader">
    <h1 class="title" id="loaderTitle">Leinster Media</h1>
  </div>

  <a class="back-link" href="index.html">&larr; back</a>

  <main class="screen" id="screen">
    <div class="pf-wrap">

      <div class="section">
        <span class="eyebrow">Portfolio</span>
        <h1 class="section-heading">Recent listing videos</h1>
        <p class="body-text">A sample of the short-form content we've produced for listings — shot, edited, and ready to post or run as ads.</p>
      </div>

      <div class="pf-carousel">
        <div class="pf-track" id="pfTrack">
          <video class="pf-video active" src="reel1.mp4" muted loop playsinline preload="metadata"></video>
          <video class="pf-video" src="reel2.mov" muted loop playsinline preload="metadata"></video>
          <video class="pf-video" src="reel3.mp4" muted loop playsinline preload="metadata"></video>
          <video class="pf-video" src="reel4.mp4" muted loop playsinline preload="metadata"></video>
          <video class="pf-video" src="reel5.mp4" muted loop playsinline preload="metadata"></video>
        </div>
        <button class="pf-nav pf-prev" onclick="pfMove(-1)" aria-label="Previous video">&larr;</button>
        <button class="pf-nav pf-next" onclick="pfMove(1)" aria-label="Next video">&rarr;</button>
      </div>

      <div class="pf-dots" id="pfDots"></div>
      <div class="pf-counter" id="pfCounter"></div>

      <hr class="rule" />

      <div class="cta-block">
        <p class="body-text">Want content like this for your own listings? First shoot is free.</p>
        <a class="cta-link" href="contact.html">Get in touch &rarr;</a>
      </div>

    </div>
  </main>

  <script src="brand.js"></script>
  <script>
    const loader = document.getElementById('loader');
    const loaderTitle = document.getElementById('loaderTitle');
    const screenEl = document.getElementById('screen');
    growBrandTitle(loaderTitle, () => {
      setTimeout(() => {
        loader.classList.add('fade-out');
        screenEl.classList.add('show');
        setTimeout(() => loader.remove(), 480);
      }, 500);
    });

    // ── Carousel ──
    const videos = Array.from(document.querySelectorAll('.pf-video'));
    const dotsWrap = document.getElementById('pfDots');
    const counter = document.getElementById('pfCounter');
    let pfIndex = 0;

    videos.forEach((v, i) => {
      const dot = document.createElement('button');
      dot.className = 'pf-dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Go to video ' + (i + 1));
      dot.addEventListener('click', () => pfGoTo(i));
      dotsWrap.appendChild(dot);

      // Skip a video that fails to load (e.g. file not yet uploaded)
      v.addEventListener('error', () => {
        v.dataset.broken = 'true';
        if (i === pfIndex) pfMove(1);
      });
    });

    function updateCounter() {
      counter.textContent = (pfIndex + 1) + ' / ' + videos.length;
    }

    function pfGoTo(i) {
      videos[pfIndex].classList.remove('active');
      videos[pfIndex].pause();
      dotsWrap.children[pfIndex].classList.remove('active');

      pfIndex = (i + videos.length) % videos.length;

      videos[pfIndex].classList.add('active');
      videos[pfIndex].currentTime = 0;
      videos[pfIndex].play().catch(() => {});
      dotsWrap.children[pfIndex].classList.add('active');
      updateCounter();
    }

    function pfMove(dir) { pfGoTo(pfIndex + dir); }

    updateCounter();
    videos[0].play().catch(() => {});

    // Swipe support on mobile
    let touchStartX = 0;
    const track = document.getElementById('pfTrack');
    track.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    track.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) pfMove(dx < 0 ? 1 : -1);
    }, { passive: true });
  </script>
</body>
</html>
